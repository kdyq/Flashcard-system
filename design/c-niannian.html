<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设计稿 C · 念念 NianNian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafafa;
    --surface:#ffffff;
    --ink:#18181b;
    --ink-2:#3f3f46;
    --muted:#71717a;
    --faint:#a1a1aa;
    --hairline:#e4e4e7;
    --accent:#1d4ed8;          /* 实色按钮 */
    --accent-bright:#2563eb;   /* 图形填充 */
    --accent-soft:#eff4ff;
    --r:8px;
    --font:"Space Grotesk","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    --mono:"JetBrains Mono","Cascadia Code",Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--font);background:var(--bg);color:var(--ink);
    font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ============ 顶栏 ============ */
  .top{border-bottom:1px solid var(--hairline);background:var(--bg);position:sticky;top:0;z-index:20}
  .top-in{
    max-width:920px;margin:0 auto;padding:0 24px;height:60px;
    display:flex;align-items:center;gap:24px;
  }
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand b{font-size:17px;font-weight:700;letter-spacing:.04em}
  .brand span{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em}
  .menu{display:flex;gap:2px}
  .menu button{
    padding:7px 13px;font-size:13.5px;font-weight:500;color:var(--muted);
    border-radius:var(--r);transition:.14s ease;
  }
  .menu button:hover{color:var(--ink);background:#f4f4f5}
  .menu button.active{color:var(--accent);background:var(--accent-soft);font-weight:600}
  .menu .soon{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:4px}
  .top-right{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .top-right i{color:var(--accent-bright);font-size:15px}

  .wrap{max-width:920px;margin:0 auto;padding:44px 24px 90px}
  .view{display:none}.view.on{display:block}

  /* ============ 仪表盘 ============ */
  .dash-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
  .kicker{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.1em;margin-bottom:8px}
  .dash-head h1{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
  .dash-head h1 .num{font-family:var(--mono);color:var(--accent);font-weight:600}
  .btn-primary{
    display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;
    padding:11px 24px;border-radius:var(--r);font-size:14.5px;font-weight:600;
    transition:transform .12s ease,background .14s ease;flex:none;
  }
  .btn-primary:hover{background:#1e40af;transform:translateY(-1px)}
  .btn-primary:active{transform:scale(.98)}
  .data-line{
    display:flex;gap:36px;margin:30px 0 0;padding:16px 0;
    border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);
  }
  .data-line .item .n{font-family:var(--mono);font-size:22px;font-weight:600}
  .data-line .item .n em{font-style:normal;font-size:13px;color:var(--faint);font-weight:400;margin-left:3px}
  .data-line .item .t{font-size:12.5px;color:var(--muted)}
  .data-line .item.hl .n{color:var(--accent)}

  .sec-title{
    display:flex;align-items:baseline;justify-content:space-between;
    margin:40px 0 6px;font-size:14px;font-weight:600;
  }
  .sec-title span{font-family:var(--mono);font-size:11.5px;color:var(--faint);font-weight:400}

  /* 卡组列表：功能列表，细线分隔 */
  .deck-row{
    display:flex;align-items:center;gap:16px;padding:15px 6px;
    border-bottom:1px solid var(--hairline);transition:background .13s ease;border-radius:6px;
  }
  .deck-row:hover{background:#f5f6f8}
  .deck-name{font-weight:600;font-size:14.5px}
  .deck-meta{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .deck-right{margin-left:auto;display:flex;align-items:center;gap:18px}
  .due{font-family:var(--mono);font-size:13px;color:var(--faint)}
  .due.hot{color:var(--accent);font-weight:600}
  .deck .go{
    font-size:13px;font-weight:600;color:var(--muted);padding:6px 14px;
    border:1px solid var(--hairline);border-radius:var(--r);transition:.14s ease;background:var(--surface);
  }
  .deck .go:hover{color:var(--accent);border-color:#c7d7f8;background:var(--accent-soft)}

  /* 热力图 + 保留率 */
  .grid-2{display:grid;grid-template-columns:1fr 220px;gap:40px}
  @media (max-width:820px){.grid-2{grid-template-columns:1fr}}
  .heat-scroll{overflow-x:auto;padding:10px 0 4px}
  .heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;width:max-content}
  .heat i{width:11px;height:11px;border-radius:3px;background:#ededf0}
  .heat i.l1{background:#dbe7fd}
  .heat i.l2{background:#b3ccfa}
  .heat i.l3{background:#5b8df0}
  .heat i.l4{background:#1d4ed8}
  .retention{padding-top:4px}
  .retention .big{font-family:var(--mono);font-size:42px;font-weight:600;letter-spacing:-.02em}
  .retention .big small{font-size:18px;color:var(--faint)}
  .retention .t{font-size:13px;color:var(--muted);margin-top:2px}
  .retention .note{font-size:12px;color:var(--faint);margin-top:10px;line-height:1.6;border-top:1px solid var(--hairline);padding-top:10px}

  /* ============ 学习 ============ */
  .study-shell{max-width:720px;margin:0 auto}
  .study-top{display:flex;align-items:center;gap:14px;margin-bottom:10px}
  .study-top .deck-name{font-size:14.5px;font-weight:600}
  .study-count{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  .study-acts{margin-left:auto;display:flex;gap:6px}
  .icon-btn{
    width:32px;height:32px;border-radius:var(--r);display:grid;place-items:center;
    color:var(--muted);font-size:16px;transition:.13s ease;
  }
  .icon-btn:hover{color:var(--ink);background:#f4f4f5}
  .study-bar{height:2px;background:var(--hairline);margin:14px 0 44px;overflow:hidden;border-radius:1px}
  .study-bar i{display:block;height:100%;width:100%;background:var(--accent-bright);transform-origin:left;transform:scaleX(0)}

  .scene{perspective:1300px}
  .card{
    background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);
    min-height:400px;padding:52px 54px 44px;display:flex;flex-direction:column;
    transform-style:preserve-3d;will-change:transform;
  }
  .card-tag{display:flex;gap:8px;margin-bottom:26px;align-items:center}
  .tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:3px 10px;border-radius:5px}
  .tag.hot{color:var(--accent);background:var(--accent-soft)}
  .tag.plain{color:var(--muted);background:#f4f4f5}
  .card-q{font-size:28px;font-weight:600;line-height:1.55;letter-spacing:-.01em;flex:1}
  .card-q .blank{display:inline-block;min-width:130px;border-bottom:1.5px solid var(--accent-bright);height:1.1em;margin:0 4px}
  .card-a{font-size:18px;line-height:1.9;color:var(--ink-2);flex:1}
  .card-a .key{color:var(--accent);font-weight:600}
  .card-a code{
    font-family:var(--mono);font-size:.86em;background:#f4f4f5;
    border:1px solid var(--hairline);padding:2px 7px;border-radius:5px;
  }
  .card-hint{display:flex;align-items:center;gap:8px;color:var(--faint);font-size:12.5px;margin-top:24px;font-family:var(--mono)}
  kbd{
    font-family:var(--mono);font-size:11px;background:var(--surface);border:1px solid var(--hairline);
    border-radius:5px;padding:1px 6px;color:var(--muted);
  }
  .card-done{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:10px;justify-content:center}
  .card-done .mono-big{font-family:var(--mono);font-size:30px;font-weight:600;color:var(--accent)}
  .card-done p{color:var(--muted);font-size:14px}

  .rates{
    display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;
    border:1px solid var(--hairline);border-radius:var(--r);overflow:hidden;background:var(--surface);
    visibility:hidden;
  }
  .rate{
    padding:14px 8px 12px;text-align:center;border-right:1px solid var(--hairline);
    transition:background .12s ease;border-radius:0;position:relative;
  }
  .rate:last-child{border-right:none}
  .rate:hover{background:#f7f8fa}
  .rate:active{background:#f0f1f4}
  .rate .rl{font-size:14px;font-weight:600}
  .rate .ri{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px}
  .rate.good{background:var(--accent)}
  .rate.good .rl,.rate.good .ri{color:#fff}
  .study-foot{margin-top:20px;color:var(--faint);font-size:12px;display:flex;gap:16px;font-family:var(--mono)}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);
    background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:var(--r);
    opacity:0;pointer-events:none;z-index:50;font-family:var(--mono);
  }
  .badge{
    position:fixed;right:16px;bottom:16px;z-index:50;font-family:var(--mono);font-size:11px;color:var(--faint);
    background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);padding:5px 10px;
  }
  @media (max-width:640px){
    .wrap{padding:30px 18px 70px}
    .card{padding:36px 26px 32px;min-height:340px}
    .card-q{font-size:22px}
    .dash-head{flex-direction:column;align-items:flex-start}
    .rates{grid-template-columns:1fr 1fr}
    .rate{border-bottom:1px solid var(--hairline)}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>念念</b><span>SPACED REPETITION</span></div>
    <nav class="menu">
      <button class="active" data-view="dash">仪表盘</button>
      <button data-view="study">学习</button>
      <button data-soon>卡组<span class="soon">P0</span></button>
      <button data-soon>统计<span class="soon">P0</span></button>
      <button data-soon>设置<span class="soon">P1</span></button>
    </nav>
    <div class="top-right"><i class="ph-fill ph-lightning"></i><span class="mono">17 天连续</span></div>
  </div>
</header>

<div class="wrap">

  <!-- ============ 仪表盘 ============ -->
  <section class="view on" id="view-dash">
    <div class="dash-head">
      <div>
        <div class="kicker">TODAY / 10-24 FRI</div>
        <h1><span class="num">33</span> 张卡片待复习</h1>
      </div>
      <button class="btn-primary" data-view="study"><i class="ph-fill ph-play"></i>开始学习</button>
    </div>

    <div class="data-line">
      <div class="item hl"><div class="n">23<em>张</em></div><div class="t">到期复习</div></div>
      <div class="item"><div class="n">10<em>张</em></div><div class="t">新卡</div></div>
      <div class="item"><div class="n">42<em>张</em></div><div class="t">今日已完成</div></div>
      <div class="item"><div class="n">14:32</div><div class="t">已用时间</div></div>
    </div>

    <div class="grid-2">
      <div>
        <div class="sec-title">卡组<span>4 DECKS / 1,064 CARDS</span></div>
        <div id="deckList"></div>
      </div>
      <div class="retention">
        <div class="sec-title" style="margin-top:40px">保留率</div>
        <div class="big">91.2<small>%</small></div>
        <div class="t">基于近 30 天 1,284 次复习</div>
        <div class="note">FSRS 根据你的实际回忆表现安排间隔，目标是花最少的时间记住最多的卡。</div>
      </div>
    </div>

    <div class="sec-title">复习记录<span>LAST 18 WEEKS</span></div>
    <div class="heat-scroll"><div class="heat" id="heat"></div></div>
  </section>

  <!-- ============ 学习 ============ -->
  <section class="view" id="view-study">
    <div class="study-shell">
      <div class="study-top">
        <span class="deck-name">计算机网络</span>
        <span class="study-count" id="count">01 / 04</span>
        <div class="study-acts">
          <button class="icon-btn" id="undoBtn" title="撤销上次评分"><i class="ph ph-arrow-counter-clockwise"></i></button>
          <button class="icon-btn" data-view="dash" title="结束学习"><i class="ph ph-x"></i></button>
        </div>
      </div>
      <div class="study-bar"><i id="studyBar"></i></div>

      <div class="scene">
        <div class="card" id="card">
          <div class="card-tag" id="cardTag"></div>
          <div class="card-q" id="cardBody">什么是 TCP 三次握手？</div>
          <div class="card-hint" id="cardHint">SPACE 显示答案</div>
        </div>
      </div>

      <div class="rates" id="rates">
        <button class="rate" data-g="again"><div class="rl">重来</div><div class="ri">&lt;1m</div></button>
        <button class="rate" data-g="hard"><div class="rl">困难</div><div class="ri">10m</div></button>
        <button class="rate good" data-g="good"><div class="rl">良好</div><div class="ri">1.2d</div></button>
        <button class="rate" data-g="easy"><div class="rl">简单</div><div class="ri">3.5d</div></button>
      </div>
      <div class="study-foot">
        <span>SPACE 翻面</span><span>1-4 评分</span><span>Z 撤销</span>
      </div>
    </div>
  </section>

</div>

<div class="toast" id="toast"></div>
<div class="badge">C · NianNian</div>

<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="./vendor/gsap.min.js"></script>
<script>
const CARDS = [
  {tag:"问答", plain:"计算机网络", front:"什么是 TCP 三次握手？",
   back:'<code>SYN</code> → <code>SYN-ACK</code> → <code>ACK</code><br><br>客户端发 SYN 同步报文，服务器回应 SYN+ACK，客户端再发 ACK 确认，连接就此建立。'},
  {tag:"填空", plain:"计算机网络", front:"HTTP 状态码 301 表示 {{c1::资源已永久迁移}}",
   back:'301 Moved Permanently：资源已<span class="key">永久迁移</span>到新 URL，搜索引擎会更新索引。'},
  {tag:"问答", plain:"算法", front:"快速排序的平均时间复杂度是多少？",
   back:'平均 <span class="key">O(n log n)</span><br><br>最坏情况 O(n²)，出现在每次划分都极不均衡时，可通过随机选取基准规避。'},
  {tag:"词汇", plain:"英语", front:"ephemeral",
   back:'<span class="key">adj. 短暂的，转瞬即逝的</span><br><br>例句：Fame is often ephemeral.'},
];
const DECKS = [
  {name:"计算机网络", meta:"128 CARDS", due:23},
  {name:"英语词汇", meta:"542 CARDS", due:0},
  {name:"算法与数据结构", meta:"76 CARDS", due:15},
  {name:"日语 N2 词汇", meta:"318 CARDS", due:8},
];

const RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const D = t => RM ? 0.01 : t;
gsap.defaults({ease:"expo.out"});
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let toastTween;
function toast(msg){
  const el=$("#toast"); el.textContent=msg;
  toastTween && toastTween.kill();
  toastTween = gsap.timeline()
    .to(el,{autoAlpha:1,y:0,duration:D(.2),startAt:{y:12}})
    .to(el,{autoAlpha:0,y:6,duration:D(.25),delay:1.5});
}

function switchView(name){
  $$(".view").forEach(v=>v.classList.remove("on"));
  const v=$("#view-"+name); v.classList.add("on");
  $$(".menu button").forEach(b=>b.classList.toggle("active",b.dataset.view===name));
  if(!RM) gsap.fromTo(v.children,{y:10,autoAlpha:0},{y:0,autoAlpha:1,duration:.4,stagger:.04});
  if(name==="dash") runDash();
  if(name==="study") resetStudy();
}
document.addEventListener("click",e=>{
  const v=e.target.closest("[data-view]");
  if(v){switchView(v.dataset.view);return}
  if(e.target.closest("[data-soon]")) toast("DEMO: 仪表盘 + 学习页");
});

$("#deckList").innerHTML = DECKS.map(d=>`
  <div class="deck-row deck">
    <div>
      <div class="deck-name">${d.name}</div>
      <div class="deck-meta">${d.meta}</div>
    </div>
    <div class="deck-right">
      <span class="due ${d.due?"hot":""}">${d.due? d.due+" 待复习":"无到期"}</span>
      <button class="go" data-view="study">学习</button>
    </div>
  </div>`).join("");

(()=>{
  let seed=1357924680;
  const rnd=()=>(seed=(seed*1664525+1013904223)>>>0,seed/4294967296);
  let html="";
  for(let w=0;w<18;w++)for(let d=0;d<7;d++){
    const r=rnd(), recent=w>12?.26:0;
    const lv=r<.32+recent?0:r<.54?1:r<.75?2:r<.92?3:4;
    html+=`<i class="${lv?"l"+lv:""}"></i>`;
  }
  $("#heat").innerHTML=html;
})();

function runDash(){
  if(RM) return;
  gsap.fromTo("#heat i",{autoAlpha:0},{autoAlpha:1,duration:.15,stagger:{each:.003,from:"start",grid:"auto"}});
  gsap.from(".data-line .item",{y:10,autoAlpha:0,duration:.35,stagger:.05});
  gsap.from(".deck-row",{y:8,autoAlpha:0,duration:.3,stagger:.05});
}

/* ============ 学习流程 ============ */
const S={i:0,flipped:false,done:false,last:null};
const card=$("#card");
const pad=n=>String(n).padStart(2,"0");
function resetStudy(){S.i=0;S.done=false;S.last=null;renderCard(true)}
function clozeToBlank(t){return t.replace(/\{\{c1::(.+?)\}\}/,'<span class="blank"></span>')}
function renderCard(enter){
  const c=CARDS[S.i];
  S.flipped=false;S.done=false;
  $("#cardTag").innerHTML=`<span class="tag hot">${c.tag}</span><span class="tag plain">${c.plain}</span>`;
  const b=$("#cardBody");
  b.className="card-q"; b.innerHTML=clozeToBlank(c.front);
  $("#cardHint").style.display="flex";
  $("#count").textContent=`${pad(S.i+1)} / ${pad(CARDS.length)}`;
  gsap.set(card,{rotationY:0,x:0,autoAlpha:1});
  gsap.to("#studyBar",{scaleX:S.i/CARDS.length,duration:D(.35)});
  gsap.set("#rates",{autoAlpha:0,y:6});
  if(enter&&!RM) gsap.from(card,{y:14,autoAlpha:0,duration:.4});
}
function reveal(){
  if(S.flipped||S.done)return;
  S.flipped=true;
  const c=CARDS[S.i];
  gsap.timeline()
    .to(card,{rotationY:90,duration:D(.19),ease:"power2.in"})
    .add(()=>{
      const b=$("#cardBody");
      b.className="card-a"; b.innerHTML=c.back;
      $("#cardHint").style.display="none";
    })
    .to(card,{rotationY:0,duration:D(.22)})
    .to("#rates",{autoAlpha:1,y:0,duration:D(.25)},RM?"":"-=.05");
}
function rate(g){
  if(!S.flipped||S.done)return;
  S.last=S.i;
  const dir=g==="again"?-1:1;
  gsap.timeline()
    .to(card,{x:dir*380,autoAlpha:0,duration:D(.32),ease:"power2.in"})
    .add(()=>{
      S.i++;
      if(S.i>=CARDS.length){finish();return}
      renderCard(true);
    });
}
function finish(){
  S.done=true;
  $("#cardTag").innerHTML="";
  const b=$("#cardBody");
  b.className="card-done";
  b.innerHTML=`
    <div class="mono-big">33 / 33</div>
    <h2 style="font-size:24px;font-weight:700">今日任务完成</h2>
    <p>复习 23 张，新学 10 张，用时 14 分 32 秒。明天预计 29 张。</p>
    <button class="btn-primary" data-view="dash" style="margin-top:8px"><i class="ph ph-arrow-left"></i>返回仪表盘</button>`;
  $("#count").textContent=`${pad(CARDS.length)} / ${pad(CARDS.length)}`;
  gsap.set(card,{x:0,autoAlpha:1});
  gsap.to("#studyBar",{scaleX:1,duration:D(.35)});
  gsap.set("#rates",{autoAlpha:0});
  if(!RM) gsap.from(".card-done > *",{y:10,autoAlpha:0,stagger:.05,duration:.35});
}
card.addEventListener("click",reveal);
$("#rates").addEventListener("click",e=>{
  const b=e.target.closest(".rate"); if(b)rate(b.dataset.g);
});
function undo(){
  if(S.last==null){toast("NO UNDO");return}
  S.i=S.last;S.last=null;
  renderCard(true);
  toast("已撤销");
}
$("#undoBtn").addEventListener("click",undo);
document.addEventListener("keydown",e=>{
  if(!$("#view-study").classList.contains("on"))return;
  if(e.code==="Space"){e.preventDefault();if(!S.done)reveal()}
  else if(e.key>="1"&&e.key<="4"){rate(["again","hard","good","easy"][+e.key-1])}
  else if(e.key.toLowerCase()==="z"){undo()}
});

if(!RM) gsap.from(".top-in",{y:-10,autoAlpha:0,duration:.4});
runDash();
</script>
</body>
</html>
