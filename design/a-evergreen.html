<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设计稿 A · 常青 Evergreen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f9f6;
    --surface:#ffffff;
    --ink:#0e1f16;
    --ink-2:#3d4f45;
    --muted:#6b7d73;
    --hairline:#e2ebe5;
    --accent:#047857;          /* 按钮、实色元素 */
    --accent-bright:#10b981;   /* 图表、填充 */
    --accent-soft:#ecfdf5;
    --accent-border:#a7f3d0;
    --r-panel:16px;
    --r-ctl:12px;
    --shadow-sm:0 1px 2px rgba(14,42,26,.05);
    --shadow-md:0 1px 2px rgba(14,42,26,.04), 0 10px 28px -14px rgba(14,42,26,.14);
    --font:"Outfit","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--ink);
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .app{display:flex;min-height:100vh}

  /* ============ 侧边栏 ============ */
  .side{
    width:232px;flex:none;background:var(--surface);
    border-right:1px solid var(--hairline);
    display:flex;flex-direction:column;
    padding:20px 14px;
    position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
  .brand-mark{
    width:34px;height:34px;border-radius:10px;background:var(--accent);
    display:grid;place-items:center;color:#fff;font-size:18px;
  }
  .brand-name{font-size:17px;font-weight:700;letter-spacing:.02em}
  .brand-sub{font-size:11px;color:var(--muted);font-weight:500;margin-top:1px;letter-spacing:.08em}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav-btn{
    display:flex;align-items:center;gap:11px;padding:10px 12px;
    border-radius:var(--r-ctl);font-size:14.5px;font-weight:500;color:var(--ink-2);
    transition:background .18s ease,color .18s ease;
    text-align:left;width:100%;
  }
  .nav-btn i{font-size:19px}
  .nav-btn:hover{background:#f2f8f4}
  .nav-btn.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .nav-btn .soon{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
  .side-foot{
    margin-top:auto;background:var(--accent-soft);border:1px solid var(--accent-border);
    border-radius:var(--r-panel);padding:14px;
  }
  .side-foot .label{font-size:12px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:6px}
  .side-foot .num{font-size:26px;font-weight:800;color:var(--accent);line-height:1.2;margin-top:2px}
  .side-foot .num small{font-size:13px;font-weight:600;color:var(--accent);opacity:.75}
  .side-foot .bar{height:6px;border-radius:3px;background:#d1fae5;margin-top:8px;overflow:hidden}
  .side-foot .bar i{display:block;height:100%;background:var(--accent-bright);border-radius:3px;transform-origin:left;transform:scaleX(0)}

  /* ============ 主区 ============ */
  .main{flex:1;padding:32px 40px 48px;max-width:1120px;margin:0 auto;width:100%}
  .view{display:none}
  .view.on{display:block}

  /* 仪表盘头 */
  .dash-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
  .dash-hi h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
  .dash-hi .date{color:var(--muted);font-size:14px;margin-top:2px}
  .chip{
    display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;
    background:var(--surface);border:1px solid var(--hairline);font-size:13.5px;font-weight:600;color:var(--ink-2);
    box-shadow:var(--shadow-sm);
  }
  .chip i{color:#e0702a;font-size:16px}

  .dash-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px}
  @media (max-width:900px){.dash-grid{grid-template-columns:1fr}.side{display:none}}

  /* 今日卡 */
  .today{
    background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-panel);
    box-shadow:var(--shadow-md);padding:26px;display:flex;align-items:center;gap:28px;
  }
  .today-info{flex:1;min-width:0}
  .today-info .cap{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em}
  .today-nums{display:flex;gap:34px;margin:14px 0 20px}
  .tnum .n{font-size:44px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
  .tnum .n em{font-style:normal;font-size:16px;font-weight:600;color:var(--muted);margin-left:2px}
  .tnum .t{font-size:13px;color:var(--muted);margin-top:2px}
  .tnum.review .n{color:var(--accent)}
  .btn-primary{
    display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;
    padding:12px 26px;border-radius:var(--r-ctl);font-size:15.5px;font-weight:600;
    box-shadow:0 8px 20px -8px rgba(4,120,87,.55);transition:transform .15s ease,box-shadow .15s ease;
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 24px -8px rgba(4,120,87,.6)}
  .btn-primary:active{transform:translateY(0) scale(.98)}
  .ring-wrap{flex:none;width:132px;text-align:center}
  .ring{width:132px;height:132px;display:block}
  .ring-bg{fill:none;stroke:#e8f3ec;stroke-width:10}
  .ring-fg{fill:none;stroke:var(--accent-bright);stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center}
  .ring-num{font:800 26px var(--font);fill:var(--ink)}
  .ring-sub{font:600 11px var(--font);fill:var(--muted)}

  /* 面板通用 */
  .panel{
    background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-panel);
    box-shadow:var(--shadow-md);padding:22px;margin-top:20px;
  }
  .panel h3{font-size:15.5px;font-weight:700;margin-bottom:4px}
  .panel .sub{font-size:12.5px;color:var(--muted)}

  /* 统计 */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
  .stat{
    background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-panel);
    box-shadow:var(--shadow-sm);padding:18px;
  }
  .stat .t{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:500}
  .stat .t i{font-size:15px;color:var(--accent)}
  .stat .n{font-size:30px;font-weight:800;margin-top:6px;letter-spacing:-.01em}
  .stat .n small{font-size:13px;font-weight:600;color:var(--muted)}

  /* 卡组列表 */
  .deck-row{
    display:flex;align-items:center;gap:16px;padding:14px 6px;border-bottom:1px solid var(--hairline);
    transition:background .15s ease;border-radius:8px;
  }
  .deck-row:last-child{border-bottom:none}
  .deck-row:hover{background:#f7fbf8}
  .deck-ico{
    width:40px;height:40px;border-radius:var(--r-ctl);background:var(--accent-soft);
    display:grid;place-items:center;color:var(--accent);font-size:20px;flex:none;
  }
  .deck-info{flex:1;min-width:0}
  .deck-name{font-weight:600;font-size:14.5px}
  .deck-meta{font-size:12.5px;color:var(--muted);margin-top:1px}
  .deck-bar{width:110px;height:5px;border-radius:3px;background:#edf3ef;overflow:hidden;flex:none}
  .deck-bar i{display:block;height:100%;background:var(--accent-bright);border-radius:3px;transform-origin:left}
  .deck-go{
    flex:none;opacity:0;transform:translateX(4px);transition:.18s ease;
    font-size:13px;font-weight:600;color:var(--accent);display:inline-flex;gap:5px;align-items:center;
    padding:7px 13px;border-radius:999px;background:var(--accent-soft);
  }
  .deck-row:hover .deck-go{opacity:1;transform:none}

  /* 热力图 */
  .heat-scroll{overflow-x:auto;margin-top:14px;padding:4px 4px 4px 0}
  .heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;width:max-content}
  .heat i{width:13px;height:13px;border-radius:4px;background:#eaf1ec}
  .heat i.l1{background:#c8e8d8}
  .heat i.l2{background:#8fd8b5}
  .heat i.l3{background:#40bd8b}
  .heat i.l4{background:#047857}

  /* ============ 学习视图 ============ */
  .study-top{display:flex;align-items:center;gap:18px;margin-bottom:8px}
  .study-deck{font-weight:700;font-size:16px;display:flex;align-items:center;gap:9px}
  .study-deck .deck-ico{width:32px;height:32px;font-size:16px;border-radius:9px}
  .study-count{font-size:13.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
  .study-acts{margin-left:auto;display:flex;gap:8px}
  .icon-btn{
    width:36px;height:36px;border-radius:var(--r-ctl);border:1px solid var(--hairline);background:var(--surface);
    display:grid;place-items:center;color:var(--ink-2);font-size:17px;transition:.15s ease;box-shadow:var(--shadow-sm);
  }
  .icon-btn:hover{border-color:var(--accent-border);color:var(--accent);background:var(--accent-soft)}
  .study-bar{height:4px;border-radius:2px;background:#e6efe9;margin:10px 0 34px;overflow:hidden}
  .study-bar i{display:block;height:100%;width:100%;background:var(--accent-bright);border-radius:2px;transform-origin:left;transform:scaleX(0)}

  .stage{display:flex;flex-direction:column;align-items:center}
  .scene{perspective:1400px;width:min(680px,100%)}
  .card{
    position:relative;width:100%;min-height:380px;border-radius:var(--r-panel);
    background:var(--surface);border:1px solid var(--hairline);box-shadow:var(--shadow-md);
    padding:44px 48px;display:flex;flex-direction:column;transform-style:preserve-3d;
    will-change:transform;
  }
  .card-tag{display:flex;gap:8px;margin-bottom:22px}
  .tag{
    font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);
    border:1px solid var(--accent-border);padding:3px 11px;border-radius:999px;
  }
  .tag.plain{color:var(--muted);background:#f4f7f5;border-color:var(--hairline)}
  .card-q{font-size:27px;font-weight:700;line-height:1.5;letter-spacing:.01em;flex:1}
  .card-q .blank{
    display:inline-block;min-width:110px;border-bottom:2px solid var(--accent-bright);
    margin:0 4px;height:1.1em;vertical-align:baseline;
  }
  .card-a{font-size:19px;line-height:1.8;color:var(--ink-2);flex:1}
  .card-a .key{
    font-size:17px;font-weight:700;color:var(--accent);background:var(--accent-soft);
    padding:2px 8px;border-radius:6px;margin:0 2px;white-space:nowrap;
  }
  .card-a code{
    font-family:"JetBrains Mono",Consolas,monospace;font-size:.88em;background:#f2f7f4;
    border:1px solid var(--hairline);padding:2px 7px;border-radius:6px;
  }
  .card-hint{
    display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-top:20px;
  }
  .card-hint i{font-size:16px}
  kbd{
    font-family:inherit;font-size:11.5px;font-weight:600;background:#f4f7f5;border:1px solid var(--hairline);
    border-bottom-width:2px;border-radius:6px;padding:1px 7px;color:var(--ink-2);
  }
  .card-done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
  .card-done .big{font-size:40px}
  .card-done .big i{color:var(--accent-bright)}
  .card-done h2{font-size:24px;font-weight:800}
  .card-done p{color:var(--muted);font-size:14px}

  /* 评分条 */
  .rates{
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(680px,100%);
    margin-top:26px;visibility:hidden;
  }
  .rate{
    position:relative;border-radius:var(--r-ctl);padding:13px 10px 12px;text-align:center;
    border:1px solid var(--hairline);background:var(--surface);box-shadow:var(--shadow-sm);
    transition:transform .12s ease,border-color .15s ease,background .15s ease;
  }
  .rate:hover{transform:translateY(-2px)}
  .rate:active{transform:scale(.96)}
  .rate .rl{font-size:14.5px;font-weight:700}
  .rate .ri{font-size:12.5px;margin-top:2px;font-weight:500}
  .rate kbd{position:absolute;top:-9px;left:50%;transform:translateX(-50%);border-radius:999px;background:var(--surface)}
  .rate.again{background:#fef3f2;border-color:#fecdcA}.rate.again .rl{color:#b42318}.rate.again .ri{color:#b42318}.rate.again kbd{border-color:#fecdca}
  .rate.hard{background:#fffaeb;border-color:#fedf89}.rate.hard .rl{color:#b54708}.rate.hard .ri{color:#b54708}.rate.hard kbd{border-color:#fedf89}
  .rate.good{background:var(--accent);border-color:var(--accent);box-shadow:0 8px 18px -8px rgba(4,120,87,.55)}
  .rate.good .rl,.rate.good .ri{color:#fff}.rate.good kbd{background:var(--accent);color:#fff;border-color:rgba(255,255,255,.4)}
  .rate.easy{background:#eff5ff;border-color:#c3d6fd}.rate.easy .rl{color:#1f3ea8}.rate.easy .ri{color:#1f3ea8}.rate.easy kbd{border-color:#c3d6fd}

  .study-foot{margin-top:22px;color:var(--muted);font-size:12.5px;display:flex;gap:14px;align-items:center}

  /* toast 与设计稿角标 */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:999px;
    opacity:0;pointer-events:none;box-shadow:0 10px 30px -8px rgba(14,31,22,.4);z-index:50;
  }
  .badge{
    position:fixed;right:16px;bottom:16px;z-index:50;font-size:12px;color:var(--muted);
    background:var(--surface);border:1px solid var(--hairline);border-radius:999px;padding:5px 12px;box-shadow:var(--shadow-sm);
  }
  @media (max-width:640px){
    .main{padding:22px 18px 40px}
    .today{flex-direction:column;align-items:flex-start}
    .rates{grid-template-columns:1fr 1fr}
    .card{padding:30px 24px;min-height:320px}
    .card-q{font-size:22px}
  }
</style>
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="brand">
      <span class="brand-mark"><i class="ph-fill ph-leaf"></i></span>
      <div>
        <div class="brand-name">常青</div>
        <div class="brand-sub">EVERGREEN</div>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-btn active" data-view="dash"><i class="ph ph-squares-four"></i>仪表盘</button>
      <button class="nav-btn" data-view="study"><i class="ph ph-graduation-cap"></i>开始学习</button>
      <button class="nav-btn" data-soon><i class="ph ph-stack"></i>卡组<span class="soon">P0</span></button>
      <button class="nav-btn" data-soon><i class="ph ph-chart-line"></i>统计<span class="soon">P0</span></button>
      <button class="nav-btn" data-soon><i class="ph ph-gear-six"></i>设置<span class="soon">P1</span></button>
    </nav>
    <div class="side-foot">
      <div class="label"><i class="ph-fill ph-fire"></i>连续学习</div>
      <div class="num"><span data-count="17">0</span> <small>天</small></div>
      <div class="bar"><i id="footBar"></i></div>
    </div>
  </aside>

  <main class="main">

    <!-- ============ 仪表盘 ============ -->
    <section class="view on" id="view-dash">
          <div class="dash-hi">
            <h1>下午好</h1>
            <div class="date">10月24日 星期五，今天有 33 张卡片等你</div>
          </div>

      <div class="dash-grid">
        <div>
          <div class="today" style="margin-top:0">
            <div class="today-info">
              <div class="cap">今日任务</div>
              <div class="today-nums">
                <div class="tnum review">
                  <div class="n"><span data-count="23">0</span><em>张</em></div>
                  <div class="t">待复习</div>
                </div>
                <div class="tnum">
                  <div class="n"><span data-count="10">0</span><em>张</em></div>
                  <div class="t">新卡</div>
                </div>
              </div>
              <button class="btn-primary" data-view="study"><i class="ph-fill ph-play"></i>开始学习</button>
            </div>
            <div class="ring-wrap">
              <svg class="ring" viewBox="0 0 120 120">
                <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
                <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52"></circle>
                <text class="ring-num" x="60" y="59" text-anchor="middle" id="ringNum" data-count="42">0</text>
                <text class="ring-sub" x="60" y="76" text-anchor="middle">已完成 / 75</text>
              </svg>
            </div>
          </div>

          <div class="panel">
            <h3>我的卡组</h3>
            <div class="sub">共 4 个卡组，1,064 张卡片</div>
            <div id="deckList"></div>
          </div>
        </div>

        <div>
          <div class="stats" style="margin-top:0">
            <div class="stat">
              <div class="t"><i class="ph ph-cards"></i>已掌握</div>
              <div class="n"><span data-count="1284">0</span> <small>张</small></div>
            </div>
            <div class="stat">
              <div class="t"><i class="ph ph-target"></i>真实保留率</div>
              <div class="n"><span data-count="91.2" data-dec="1">0</span><small>%</small></div>
            </div>
          </div>
          <div class="panel">
            <h3>复习热力图</h3>
            <div class="sub">近 18 周，颜色越深复习越多</div>
            <div class="heat-scroll"><div class="heat" id="heat"></div></div>
          </div>
          <div class="panel">
            <h3>未来负荷</h3>
            <div class="sub">按 FSRS 预测的每日到期量</div>
            <div id="load" style="display:flex;align-items:flex-end;gap:5px;height:64px;margin-top:14px"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ 学习 ============ -->
    <section class="view" id="view-study">
      <div class="study-top">
        <div class="study-deck"><span class="deck-ico"><i class="ph ph-wifi-high"></i></span>计算机网络</div>
        <div class="study-count" id="count">1 / 4</div>
        <div class="study-acts">
          <button class="icon-btn" id="undoBtn" title="撤销上次评分"><i class="ph ph-arrow-counter-clockwise"></i></button>
          <button class="icon-btn" data-view="dash" title="结束学习"><i class="ph ph-x"></i></button>
        </div>
      </div>
      <div class="study-bar"><i id="studyBar"></i></div>

      <div class="stage">
        <div class="scene">
          <div class="card" id="card">
            <div class="card-tag" id="cardTag"></div>
            <div class="card-q" id="cardBody">什么是 TCP 三次握手？</div>
            <div class="card-hint" id="cardHint"><i class="ph ph-hand-tap"></i>点击卡片或按 <kbd>空格</kbd> 显示答案</div>
          </div>
        </div>
        <div class="rates" id="rates">
          <button class="rate again" data-g="again"><kbd>1</kbd><div class="rl">重来</div><div class="ri">&lt;1 分钟</div></button>
          <button class="rate hard" data-g="hard"><kbd>2</kbd><div class="rl">困难</div><div class="ri">10 分钟</div></button>
          <button class="rate good" data-g="good"><kbd>3</kbd><div class="rl">良好</div><div class="ri">1.2 天</div></button>
          <button class="rate easy" data-g="easy"><kbd>4</kbd><div class="rl">简单</div><div class="ri">3.5 天</div></button>
        </div>
        <div class="study-foot">
          <span><kbd>空格</kbd> 翻面</span>
          <span><kbd>1</kbd>-<kbd>4</kbd> 评分</span>
          <span><kbd>Z</kbd> 撤销</span>
        </div>
      </div>
    </section>

  </main>
</div>

<div class="toast" id="toast"></div>
<div class="badge">设计稿 A · 常青 Evergreen</div>

<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="./vendor/gsap.min.js"></script>
<script>
/* ============ 数据 ============ */
const CARDS = [
  {tag:"问答", plain:"计算机网络", front:"什么是 TCP 三次握手？",
   back:'<code>SYN</code> → <code>SYN-ACK</code> → <code>ACK</code><br><br>客户端发 SYN 同步报文，服务器回应 SYN+ACK，客户端再发 ACK 确认，连接就此建立。'},
  {tag:"填空", plain:"计算机网络", front:"HTTP 状态码 301 表示 {{c1::资源已永久迁移}}",
   back:'301 Moved Permanently：资源已<span class="key">永久迁移</span>到新 URL，搜索引擎会更新索引。'},
  {tag:"问答", plain:"算法", front:"快速排序的平均时间复杂度是多少？",
   back:'平均 <span class="key">O(n log n)</span><br><br>最坏情况 O(n²)，出现在每次划分都极不均衡时，可通过随机选取基准规避。'},
  {tag:"词汇", plain:"英语", front:"ephemeral",
   back:'<span class="key">adj. 短暂的，转瞬即逝的</span><br><br>例句：Fame is often ephemeral.'},
];
const DECKS = [
  {ico:"ph-wifi-high", name:"计算机网络", total:128, due:23, done:.72},
  {ico:"ph-translate", name:"英语词汇", total:542, due:0, done:.95},
  {ico:"ph-graph", name:"算法与数据结构", total:76, due:15, done:.41},
  {ico:"ph-book-open-text", name:"日语 N2 词汇", total:318, due:8, done:.58},
];

const RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const D = t => RM ? 0.01 : t;
gsap.defaults({ease:"power2.out"});

/* ============ 工具 ============ */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
let toastTween;
function toast(msg){
  const el = $("#toast");
  el.textContent = msg;
  toastTween && toastTween.kill();
  toastTween = gsap.timeline()
    .to(el,{autoAlpha:1,y:0,duration:D(.25),startAt:{y:16}})
    .to(el,{autoAlpha:0,y:8,duration:D(.3),delay:1.6});
}

/* ============ 视图切换 ============ */
function switchView(name){
  $$(".view").forEach(v=>v.classList.remove("on"));
  const v = $("#view-"+name); v.classList.add("on");
  $$(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.view===name));
  if(!RM) gsap.fromTo(v.children,{y:18,autoAlpha:0},{y:0,autoAlpha:1,duration:.45,stagger:.05,ease:"power3.out"});
  if(name==="dash") runDashMotion();
  if(name==="study") resetStudy();
}
document.addEventListener("click",e=>{
  const v = e.target.closest("[data-view]");
  if(v){switchView(v.dataset.view);return}
  if(e.target.closest("[data-soon]")) toast("设计稿演示范围：仪表盘与学习页");
});

/* ============ 仪表盘渲染 ============ */
function buildDecks(){
  $("#deckList").innerHTML = DECKS.map(d=>`
    <div class="deck-row">
      <span class="deck-ico"><i class="ph ${d.ico}"></i></span>
      <div class="deck-info">
        <div class="deck-name">${d.name}</div>
        <div class="deck-meta">${d.total} 张${d.due? "，"+d.due+" 待复习":""}</div>
      </div>
      <div class="deck-bar"><i data-w="${d.done}"></i></div>
      <button class="deck-go" data-view="study">复习<i class="ph ph-arrow-right"></i></button>
    </div>`).join("");
}
function buildHeat(){
  // 固定种子伪随机，保证每次打开效果一致
  let seed = 20261024;
  const rnd = ()=> (seed = (seed*1664525+1013904223)>>>0, seed/4294967296);
  let html = "";
  for(let w=0;w<18;w++)for(let d=0;d<7;d++){
    const r = rnd(), recent = w>11 ? .28 : 0;
    const lv = r < .30+recent ? 0 : r < .52 ? 1 : r < .72 ? 2 : r < .9 ? 3 : 4;
    html += `<i class="${lv?"l"+lv:""}"></i>`;
  }
  $("#heat").innerHTML = html;
}
function buildLoad(){
  const vals=[12,23,18,9,14,20,26,31,24,17,11,8,15,22];
  const max=Math.max(...vals);
  $("#load").innerHTML = vals.map(v=>
    `<div style="flex:1;background:${v>=24?"var(--accent)":"#bfe5d3"};border-radius:4px;height:${Math.round(v/max*100)}%"></div>`).join("");
}
function runDashMotion(){
  // 进度环
  const C=2*Math.PI*52, pct=42/75;
  gsap.fromTo("#ringFg",{strokeDasharray:C,strokeDashoffset:C},
    {strokeDashoffset:C*(1-pct),duration:D(1.1),ease:"power3.inOut"});
  // 数字滚动
  $$("[data-count]").forEach(el=>{
    const target=parseFloat(el.dataset.count), dec=+(el.dataset.dec||0);
    const o={v:0};
    gsap.to(o,{v:target,duration:D(1),ease:"power2.out",
      onUpdate:()=>el.textContent = dec? o.v.toFixed(dec) : Math.round(o.v)});
  });
  // 卡组进度条
  gsap.to(".deck-bar i",{scaleX:(i,el)=>+el.dataset.w,duration:D(.8),stagger:.06,ease:"power3.out"});
  gsap.set("#footBar",{scaleX:17/30});
  // 热力图
  if(!RM){
    gsap.from("#heat i",{scale:0,autoAlpha:0,duration:.3,stagger:{each:.004,from:"random"},ease:"back.out(2)"});
    gsap.from("#load div",{scaleY:0,transformOrigin:"bottom",duration:.5,stagger:.03,ease:"power3.out"});
  }
}

/* ============ 学习流程 ============ */
const S = {i:0, flipped:false, done:false, last:null};
const card=$("#card");
function resetStudy(){
  S.i=0;S.done=false;S.last=null;
  renderCard(true);
}
function clozeToBlank(t){return t.replace(/\{\{c1::(.+?)\}\}/,'<span class="blank"></span>')}
function renderCard(enter){
  const c=CARDS[S.i];
  S.flipped=false;S.done=false;
  $("#cardTag").innerHTML=`<span class="tag">${c.tag}</span><span class="tag plain">${c.plain}</span>`;
  $("#cardBody").className="card-q";
  $("#cardBody").innerHTML=clozeToBlank(c.front);
  $("#cardHint").style.display="flex";
  $("#count").textContent=`${S.i+1} / ${CARDS.length}`;
  gsap.set(card,{rotationY:0});
  gsap.to("#studyBar",{scaleX:S.i/CARDS.length,duration:D(.4)});
  gsap.set("#rates",{autoAlpha:0,y:8});
  if(enter&&!RM) gsap.from(card,{y:26,scale:.97,autoAlpha:0,duration:.45,ease:"power3.out"});
}
function reveal(){
  if(S.flipped||S.done)return;
  S.flipped=true;
  const c=CARDS[S.i];
  const tl=gsap.timeline();
  tl.to(card,{rotationY:90,scale:.97,duration:D(.26),ease:"power2.in"})
    .add(()=>{
      $("#cardBody").className="card-a";
      $("#cardBody").innerHTML=c.back;
      $("#cardHint").style.display="none";
    })
    .to(card,{rotationY:0,scale:1,duration:D(.3),ease:"power2.out"})
    .to("#rates",{autoAlpha:1,y:0,duration:D(.3)},RM?"":"-=.1");
}
function rate(g){
  if(!S.flipped||S.done)return;
  S.last=S.i;
  const dir=g==="again"?-1:1;
  const tl=gsap.timeline();
  tl.to(card,{x:dir*460,rotation:dir*6,autoAlpha:0,duration:D(.4),ease:"power2.in"})
    .add(()=>next());
}
function next(){
  S.i++;
  if(S.i>=CARDS.length){finish();return}
  gsap.set(card,{x:0,rotation:0});
  renderCard(true);
}
function finish(){
  S.done=true;
  $("#cardTag").innerHTML="";
  $("#cardBody").className="card-done";
  $("#cardBody").innerHTML=`
    <div class="big"><i class="ph-fill ph-seal-check"></i></div>
    <h2>今日任务完成</h2>
    <p>复习 23 张，新学 10 张，用时 14 分钟</p>
    <button class="btn-primary" data-view="dash"><i class="ph ph-arrow-left"></i>返回仪表盘</button>`;
  $("#count").textContent=`${CARDS.length} / ${CARDS.length}`;
  gsap.set(card,{x:0,rotation:0});
  gsap.to("#studyBar",{scaleX:1,duration:D(.4)});
  gsap.set("#rates",{autoAlpha:0});
  if(!RM) gsap.from(".card-done > *",{y:16,autoAlpha:0,stagger:.07,duration:.4,ease:"power3.out"});
}
card.addEventListener("click",reveal);
$("#rates").addEventListener("click",e=>{
  const b=e.target.closest(".rate"); if(b)rate(b.dataset.g);
});
$("#undoBtn").addEventListener("click",undo);
function undo(){
  if(S.last==null){toast("没有可撤销的评分");return}
  S.i=S.last;S.last=null;
  renderCard(true);
  toast("已撤销，重新评分");
}
document.addEventListener("keydown",e=>{
  if($("#view-study").classList.contains("on")===false)return;
  if(e.code==="Space"){e.preventDefault();S.done?null:reveal()}
  else if(e.key>="1"&&e.key<="4"){rate(["again","hard","good","easy"][+e.key-1])}
  else if(e.key.toLowerCase()==="z"){undo()}
});

/* ============ 启动 ============ */
buildDecks();buildHeat();buildLoad();
if(!RM){
  gsap.from(".side",{x:-24,autoAlpha:0,duration:.5,ease:"power3.out"});
  gsap.from(".nav-btn",{x:-14,autoAlpha:0,duration:.35,stagger:.05,ease:"power2.out",delay:.1});
  gsap.from(".side-foot",{y:14,autoAlpha:0,duration:.4,delay:.3});
}
runDashMotion();
</script>
</body>
</html>
