<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设计稿 B · 翻翻 FanFan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f2;
    --paper:#fffdf9;
    --surface:#ffffff;
    --ink:#26221c;
    --ink-2:#4d463b;
    --muted:#8a8172;
    --hairline:#e8e3d8;
    --accent:#c03d2c;          /* 印章朱红：实色按钮 */
    --accent-bright:#d94f3d;   /* 填充、图形 */
    --accent-soft:#fbeeeb;
    --accent-border:#efc9c1;
    --rule:#e9b8ad;            /* 卡片顶部横线 */
    --r:12px;
    --shadow-sm:0 1px 3px rgba(66,50,32,.07);
    --shadow-md:0 1px 3px rgba(66,50,32,.06),0 12px 30px -12px rgba(66,50,32,.18);
    --hand:"Caveat","Zhi Mang Xing",cursive;
    --font:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--font);background:var(--bg);color:var(--ink);
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ============ 顶栏 ============ */
  .top{
    position:sticky;top:0;z-index:20;background:rgba(247,246,242,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--hairline);
  }
  .top-in{
    max-width:1060px;margin:0 auto;padding:14px 24px;
    display:flex;align-items:center;gap:28px;
  }
  .brand{display:flex;align-items:center;gap:11px}
  .brand-card{
    width:36px;height:36px;background:var(--paper);border:1px solid var(--hairline);
    border-radius:8px;box-shadow:var(--shadow-sm);position:relative;
    display:grid;place-items:center;transform:rotate(-6deg);
    font-family:"Zhi Mang Xing",var(--hand);font-size:21px;color:var(--accent);padding-top:5px;
  }
  .brand-card::before{content:"";position:absolute;left:6px;right:6px;top:7px;height:1.5px;background:var(--rule)}
  .brand-name{font-family:"Zhi Mang Xing",var(--hand);font-size:24px;line-height:1;transform:translateY(2px)}
  .brand-sub{font-family:var(--hand);font-size:15px;color:var(--muted);margin-left:2px;transform:translateY(3px)}
  .menu{display:flex;gap:4px;margin-left:8px}
  .menu button{
    padding:8px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink-2);
    transition:.16s ease;
  }
  .menu button:hover{background:#efece4}
  .menu button.active{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 4px 12px -4px rgba(192,61,44,.5)}
  .menu .soon{font-size:11px;opacity:.75;margin-left:3px}
  .stamp{
    margin-left:auto;width:74px;height:74px;border:2.5px solid var(--accent-bright);border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--accent);transform:rotate(8deg);opacity:.88;flex:none;
    mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='74' height='74'><rect x='2' y='2' width='70' height='70' rx='35' ry='35' fill='white'/></svg>");
    -webkit-mask-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='74' height='74'><rect x='2' y='2' width='70' height='70' rx='35' ry='35' fill='white'/></svg>");
  }
  .stamp .n{font-family:var(--hand);font-size:30px;line-height:.9;font-weight:700}
  .stamp .t{font-size:10px;font-weight:700;letter-spacing:.15em;margin-top:2px}
  @media (max-width:760px){.stamp{display:none}}

  .wrap{max-width:1060px;margin:0 auto;padding:30px 24px 70px}
  .view{display:none}.view.on{display:block}

  /* ============ 仪表盘 ============ */
  .hero{
    display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;
  }
  @media (max-width:760px){.hero{grid-template-columns:1fr}}
  .hero h1{font-family:"Zhi Mang Xing",var(--hand);font-size:44px;line-height:1.2;font-weight:400}
  .hero h1 mark{background:none;color:var(--accent)}
  .hero .sub{color:var(--muted);font-size:14px;margin-top:4px}
  .index-card{
    background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r);
    box-shadow:var(--shadow-md);position:relative;padding:34px 30px 26px;
    width:340px;justify-self:end;
  }
  .index-card::before{
    content:"";position:absolute;left:18px;right:18px;top:22px;height:2px;background:var(--rule);
  }
  .ic-row{display:flex;gap:30px;margin:14px 0 18px;padding-top:8px}
  .ic-num .n{font-family:var(--hand);font-size:52px;line-height:1;font-weight:700;color:var(--ink)}
  .ic-num.review .n{color:var(--accent)}
  .ic-num .n em{font-style:normal;font-family:var(--font);font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
  .ic-num .t{font-size:12.5px;color:var(--muted);margin-top:2px}
  .btn-flip{
    display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;
    padding:12px 26px;border-radius:999px;font-size:15.5px;font-weight:600;
    box-shadow:0 6px 16px -6px rgba(192,61,44,.6);transition:transform .15s ease;
  }
  .btn-flip:hover{transform:translateY(-2px) rotate(-1deg)}
  .btn-flip:active{transform:scale(.96)}
  .ic-cap{position:absolute;top:30px;right:26px;font-family:var(--hand);font-size:19px;color:var(--muted);transform:rotate(3deg)}

  .cols{display:grid;grid-template-columns:1fr 320px;gap:26px;margin-top:30px}
  @media (max-width:900px){.cols{grid-template-columns:1fr}}

  .panel-title{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
  .panel-title h3{font-size:16px;font-weight:700}
  .panel-title span{font-size:12.5px;color:var(--muted)}

  /* 卡组堆 */
  .pile{display:flex;flex-direction:column;gap:14px}
  .deck{
    background:var(--paper);border:1px solid var(--hairline);border-radius:var(--r);
    box-shadow:var(--shadow-sm);padding:16px 18px 16px 26px;position:relative;
    display:flex;align-items:center;gap:16px;transition:transform .2s ease,box-shadow .2s ease;
  }
  .deck:nth-child(odd){transform:rotate(-.7deg)}
  .deck:nth-child(even){transform:rotate(.6deg)}
  .deck:hover{transform:rotate(0) translateY(-3px);box-shadow:var(--shadow-md)}
  .deck .tab{
    position:absolute;left:-1px;top:14px;bottom:14px;width:8px;border-radius:99px 0 0 99px;
    background:var(--accent-bright);
  }
  .deck:nth-child(2) .tab{opacity:.55}
  .deck:nth-child(3) .tab{opacity:.35}
  .deck:nth-child(4) .tab{opacity:.22}
  .deck-name{font-weight:700;font-size:15px}
  .deck-meta{font-size:12.5px;color:var(--muted);margin-top:1px}
  .deck-right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .dots{display:flex;gap:3px}
  .dots i{width:6px;height:6px;border-radius:50%;background:#e5dfd2}
  .dots i.f{background:var(--accent-bright)}
  .deck .go{
    font-size:13px;font-weight:600;color:var(--accent);padding:6px 14px;border-radius:999px;
    border:1.5px solid var(--accent-border);background:var(--accent-soft);transition:.15s ease;
  }
  .deck .go:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* 打卡日历 */
  .cal-panel{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r);padding:20px;box-shadow:var(--shadow-sm)}
  .heat-scroll{overflow-x:auto;padding-bottom:4px}
  .heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;width:max-content}
  .heat i{width:12px;height:12px;border-radius:3px;background:#efece4}
  .heat i.l1{background:#f3cdc3}
  .heat i.l2{background:#e9968a}
  .heat i.l3{background:#d94f3d}
  .heat i.l4{background:#a93123}
  .motto{
    margin-top:18px;background:var(--accent-soft);border:1px dashed var(--accent-border);
    border-radius:var(--r);padding:16px 18px;
  }
  .motto .h{font-family:var(--hand);font-size:24px;color:var(--accent);line-height:1.25}
  .motto .s{font-size:12.5px;color:var(--muted);margin-top:2px}

  /* ============ 学习 ============ */
  .study-top{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .study-top .deck-name{font-size:16px}
  .study-count{font-size:13.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
  .study-acts{margin-left:auto;display:flex;gap:8px}
  .icon-btn{
    width:36px;height:36px;border-radius:50%;border:1.5px solid var(--hairline);background:var(--surface);
    display:grid;place-items:center;color:var(--ink-2);font-size:17px;transition:.15s ease;
  }
  .icon-btn:hover{border-color:var(--accent-border);color:var(--accent);background:var(--accent-soft)}
  .study-bar{height:5px;border-radius:3px;background:#ede9df;margin:12px 0 42px;overflow:hidden}
  .study-bar i{display:block;height:100%;width:100%;background:var(--accent-bright);border-radius:3px;transform-origin:left;transform:scaleX(0)}

  .stage{display:flex;flex-direction:column;align-items:center}
  .scene{perspective:1500px;width:min(660px,100%);position:relative}
  .ghost{
    position:absolute;inset:0;background:var(--paper);border:1px solid var(--hairline);
    border-radius:var(--r);box-shadow:var(--shadow-sm);
  }
  .ghost.g1{transform:rotate(2.4deg) translateY(8px) scale(.985)}
  .ghost.g2{transform:rotate(-2deg) translateY(16px) scale(.97)}
  .card{
    position:relative;width:100%;min-height:390px;background:var(--paper);
    border:1px solid var(--hairline);border-radius:var(--r);box-shadow:var(--shadow-md);
    padding:52px 46px 40px;transform-style:preserve-3d;will-change:transform;
    display:flex;flex-direction:column;
  }
  .card::before{content:"";position:absolute;left:26px;right:26px;top:30px;height:2px;background:var(--rule)}
  .card-tag{position:absolute;top:38px;right:32px;display:flex;gap:8px}
  .tag{font-size:12px;font-weight:600;padding:3px 12px;border-radius:999px}
  .tag.hot{color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-border)}
  .tag.plain{color:var(--muted);background:#f4f1ea;border:1px solid var(--hairline)}
  .card-q{font-size:26px;font-weight:700;line-height:1.55;flex:1;padding-top:22px}
  .card-q .blank{display:inline-block;min-width:120px;border-bottom:2.5px dashed var(--accent-bright);height:1.1em;margin:0 4px}
  .card-a{font-size:19px;line-height:1.85;color:var(--ink-2);flex:1;padding-top:22px}
  .card-a .key{
    font-weight:700;color:var(--accent);background:var(--accent-soft);
    padding:1px 8px;border-radius:6px;margin:0 2px;white-space:nowrap;
  }
  .card-a code{
    font-family:Consolas,monospace;font-size:.88em;background:#f4f1ea;
    border:1px solid var(--hairline);padding:2px 7px;border-radius:6px;
  }
  .card-hint{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;margin-top:18px}
  kbd{
    font-family:inherit;font-size:11.5px;font-weight:600;background:#fff;border:1px solid var(--hairline);
    border-bottom-width:2.5px;border-radius:6px;padding:1px 8px;color:var(--ink-2);
  }
  .card-done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding-top:0}
  .card-done .seal{
    width:88px;height:88px;border:3px solid var(--accent-bright);border-radius:50%;
    display:grid;place-items:center;font-size:38px;color:var(--accent);transform:rotate(-8deg);
  }
  .card-done h2{font-family:"Zhi Mang Xing",var(--hand);font-size:34px;font-weight:400}
  .card-done p{color:var(--muted);font-size:14px}

  /* 评分：印章按钮 */
  .rates{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:min(660px,100%);margin-top:34px;visibility:hidden}
  .rate{
    border-radius:14px;padding:14px 8px 12px;text-align:center;background:var(--surface);
    border:2px solid var(--hairline);transition:transform .12s ease,border-color .15s ease;
    position:relative;
  }
  .rate:hover{transform:translateY(-3px) rotate(-1deg)}
  .rate:active{transform:scale(.93)}
  .rate .rl{font-size:15px;font-weight:700}
  .rate .ri{font-family:var(--hand);font-size:18px;line-height:1.1;margin-top:1px;font-weight:600}
  .rate kbd{position:absolute;top:-10px;left:50%;transform:translateX(-50%);border-radius:999px;background:var(--surface)}
  .rate.again{border-color:#f2c1ba}.rate.again .rl{color:#b42318}.rate.again .ri{color:#b42318}
  .rate.hard{border-color:#ecd9b0}.rate.hard .rl{color:#93661a}.rate.hard .ri{color:#93661a}
  .rate.good{background:var(--accent);border-color:var(--accent);box-shadow:0 8px 18px -8px rgba(192,61,44,.55)}
  .rate.good .rl,.rate.good .ri{color:#fff}
  .rate.good kbd{background:var(--accent);color:#fff;border-color:rgba(255,255,255,.45)}
  .rate.easy{border-color:#cfd8ea}.rate.easy .rl{color:#33529e}.rate.easy .ri{color:#33529e}
  .study-foot{margin-top:24px;color:var(--muted);font-size:12.5px;display:flex;gap:14px}

  /* 评分后的印章落印 */
  .mark{
    position:absolute;left:50%;top:38%;z-index:5;pointer-events:none;
    transform:translate(-50%,-50%);width:130px;height:130px;border-radius:50%;
    border:4px solid var(--accent-bright);color:var(--accent);
    display:grid;place-items:center;font-family:"Zhi Mang Xing",var(--hand);
    font-size:44px;background:rgba(255,253,249,.85);opacity:0;
  }

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:999px;
    opacity:0;pointer-events:none;z-index:50;box-shadow:0 10px 30px -8px rgba(38,34,28,.4);
  }
  .badge{
    position:fixed;right:16px;bottom:16px;z-index:50;font-size:12px;color:var(--muted);
    background:var(--surface);border:1px solid var(--hairline);border-radius:999px;padding:5px 12px;box-shadow:var(--shadow-sm);
  }
  @media (max-width:640px){
    .card{padding:46px 24px 28px;min-height:330px}
    .card-q{font-size:21px}
    .rates{grid-template-columns:1fr 1fr}
    .index-card{width:100%;justify-self:stretch}
  }
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <span class="brand-card">翻</span>
      <span class="brand-name">翻翻</span>
      <span class="brand-sub">flip &amp; remember</span>
    </div>
    <nav class="menu">
      <button class="active" data-view="dash">仪表盘</button>
      <button data-view="study">开始学习</button>
      <button data-soon>卡组<span class="soon">P0</span></button>
      <button data-soon>统计<span class="soon">P0</span></button>
      <button data-soon>设置<span class="soon">P1</span></button>
    </nav>
    <div class="stamp" title="连续学习天数">
      <span class="n">17</span>
      <span class="t">连续天数</span>
    </div>
  </div>
</header>

<div class="wrap">

  <!-- ============ 仪表盘 ============ -->
  <section class="view on" id="view-dash">
    <div class="hero">
      <div>
        <h1>今天也要<mark>翻一翻</mark></h1>
        <div class="sub">10月24日 星期五。遗忘曲线不等人，先复习再玩耍。</div>
      </div>
      <div class="index-card">
        <span class="ic-cap">to-do</span>
        <div class="ic-row">
          <div class="ic-num review"><div class="n">23<em>张</em></div><div class="t">待复习</div></div>
          <div class="ic-num"><div class="n">10<em>张</em></div><div class="t">新卡</div></div>
        </div>
        <button class="btn-flip" data-view="study"><i class="ph ph-cards"></i>开始翻牌</button>
      </div>
    </div>

    <div class="cols">
      <div>
        <div class="panel-title"><h3>卡组</h3><span>4 组 / 1,064 张</span></div>
        <div class="pile" id="deckList"></div>
      </div>
      <div>
        <div class="panel-title"><h3>打卡日历</h3><span>近 18 周</span></div>
        <div class="cal-panel">
          <div class="heat-scroll"><div class="heat" id="heat"></div></div>
        </div>
        <div class="motto">
          <div class="h">每次翻面，都是和遗忘打的一仗。</div>
          <div class="s">FSRS 会替你记住每一张卡的脾气。</div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 学习 ============ -->
  <section class="view" id="view-study">
    <div class="study-top">
      <span class="deck-name">计算机网络</span>
      <span class="study-count" id="count">1 / 4</span>
      <div class="study-acts">
        <button class="icon-btn" id="undoBtn" title="撤销上次评分"><i class="ph ph-arrow-counter-clockwise"></i></button>
        <button class="icon-btn" data-view="dash" title="结束学习"><i class="ph ph-x"></i></button>
      </div>
    </div>
    <div class="study-bar"><i id="studyBar"></i></div>

    <div class="stage">
      <div class="scene">
        <div class="ghost g2"></div>
        <div class="ghost g1"></div>
        <div class="card" id="card">
          <div class="mark" id="mark">良好</div>
          <div class="card-tag" id="cardTag"></div>
          <div class="card-q" id="cardBody">什么是 TCP 三次握手？</div>
          <div class="card-hint" id="cardHint"><i class="ph ph-hand-tap"></i>点一下卡片，或按 <kbd>空格</kbd> 翻面</div>
        </div>
      </div>
      <div class="rates" id="rates">
        <button class="rate again" data-g="again" data-label="重来"><kbd>1</kbd><div class="rl">重来</div><div class="ri">&lt;1 min</div></button>
        <button class="rate hard" data-g="hard" data-label="困难"><kbd>2</kbd><div class="rl">困难</div><div class="ri">10 min</div></button>
        <button class="rate good" data-g="good" data-label="良好"><kbd>3</kbd><div class="rl">良好</div><div class="ri">1.2 天</div></button>
        <button class="rate easy" data-g="easy" data-label="简单"><kbd>4</kbd><div class="rl">简单</div><div class="ri">3.5 天</div></button>
      </div>
      <div class="study-foot">
        <span><kbd>空格</kbd> 翻面</span>
        <span><kbd>1</kbd>-<kbd>4</kbd> 评分</span>
        <span><kbd>Z</kbd> 撤销</span>
      </div>
    </div>
  </section>

</div>

<div class="toast" id="toast"></div>
<div class="badge">设计稿 B · 翻翻 FanFan</div>

<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="./vendor/gsap.min.js"></script>
<script>
const CARDS = [
  {tag:"问答", plain:"计算机网络", front:"什么是 TCP 三次握手？",
   back:'<code>SYN</code> → <code>SYN-ACK</code> → <code>ACK</code><br><br>客户端发 SYN 同步报文，服务器回应 SYN+ACK，客户端再发 ACK 确认，连接就此建立。'},
  {tag:"填空", plain:"计算机网络", front:"HTTP 状态码 301 表示 {{c1::资源已永久迁移}}",
   back:'301 Moved Permanently：资源已<span class="key">永久迁移</span>到新 URL，搜索引擎会更新索引。'},
  {tag:"问答", plain:"算法", front:"快速排序的平均时间复杂度是多少？",
   back:'平均 <span class="key">O(n log n)</span><br><br>最坏情况 O(n²)，出现在每次划分都极不均衡时，可通过随机选取基准规避。'},
  {tag:"词汇", plain:"英语", front:"ephemeral",
   back:'<span class="key">adj. 短暂的，转瞬即逝的</span><br><br>例句：Fame is often ephemeral.'},
];
const DECKS = [
  {name:"计算机网络", total:128, due:23, prog:8},
  {name:"英语词汇", total:542, due:0, prog:10},
  {name:"算法与数据结构", total:76, due:15, prog:4},
  {name:"日语 N2 词汇", total:318, due:8, prog:6},
];

const RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const D = t => RM ? 0.01 : t;
gsap.defaults({ease:"power2.out"});
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let toastTween;
function toast(msg){
  const el=$("#toast"); el.textContent=msg;
  toastTween && toastTween.kill();
  toastTween = gsap.timeline()
    .to(el,{autoAlpha:1,y:0,duration:D(.25),startAt:{y:16}})
    .to(el,{autoAlpha:0,y:8,duration:D(.3),delay:1.6});
}

function switchView(name){
  $$(".view").forEach(v=>v.classList.remove("on"));
  const v=$("#view-"+name); v.classList.add("on");
  $$(".menu button").forEach(b=>b.classList.toggle("active",b.dataset.view===name));
  if(!RM) gsap.fromTo(v.children,{y:22,autoAlpha:0,rotation:-.5},{y:0,autoAlpha:1,rotation:0,duration:.5,stagger:.07,ease:"back.out(1.6)"});
  if(name==="dash") runDash();
  if(name==="study") resetStudy();
}
document.addEventListener("click",e=>{
  const v=e.target.closest("[data-view]");
  if(v){switchView(v.dataset.view);return}
  if(e.target.closest("[data-soon]")) toast("设计稿演示范围：仪表盘与学习页");
});

/* 卡组堆 */
$("#deckList").innerHTML = DECKS.map(d=>`
  <div class="deck">
    <span class="tab"></span>
    <div>
      <div class="deck-name">${d.name}</div>
      <div class="deck-meta">${d.total} 张${d.due? "，"+d.due+" 待复习":"，今天没有到期的"}</div>
    </div>
    <div class="deck-right">
      <div class="dots">${'<i class="f"></i>'.repeat(d.prog)}${'<i></i>'.repeat(10-d.prog)}</div>
      <button class="go" data-view="study">翻牌</button>
    </div>
  </div>`).join("");

/* 打卡日历 */
(()=>{
  let seed=987654321;
  const rnd=()=>(seed=(seed*1664525+1013904223)>>>0,seed/4294967296);
  let html="";
  for(let w=0;w<18;w++)for(let d=0;d<7;d++){
    const r=rnd(), recent=w>12?.3:0;
    const lv=r<.34+recent?0:r<.55?1:r<.74?2:r<.9?3:4;
    html+=`<i class="${lv?"l"+lv:""}"></i>`;
  }
  $("#heat").innerHTML=html;
})();

function runDash(){
  if(RM) return;
  gsap.from(".deck",{y:26,autoAlpha:0,rotation:i=>i%2?2.5:-2.5,duration:.5,stagger:.08,ease:"back.out(1.7)"});
  gsap.from(".index-card",{y:30,rotation:3,autoAlpha:0,duration:.55,ease:"back.out(1.5)"});
  gsap.from("#heat i",{scale:0,autoAlpha:0,duration:.25,stagger:{each:.004,from:"random"},ease:"back.out(2.5)"});
  gsap.from(".stamp",{scale:1.9,autoAlpha:0,rotation:30,duration:.5,ease:"back.out(2.2)",delay:.4});
}

/* ============ 学习流程 ============ */
const S={i:0,flipped:false,done:false,last:null};
const card=$("#card");
function resetStudy(){S.i=0;S.done=false;S.last=null;renderCard(true)}
function clozeToBlank(t){return t.replace(/\{\{c1::(.+?)\}\}/,'<span class="blank"></span>')}
function renderCard(enter){
  const c=CARDS[S.i];
  S.flipped=false;S.done=false;
  $("#cardTag").innerHTML=`<span class="tag hot">${c.tag}</span><span class="tag plain">${c.plain}</span>`;
  const b=$("#cardBody");
  b.className="card-q"; b.innerHTML=clozeToBlank(c.front);
  $("#cardHint").style.display="flex";
  $("#count").textContent=`${S.i+1} / ${CARDS.length}`;
  gsap.set(card,{rotationY:0,x:0,rotation:0,autoAlpha:1});
  gsap.to("#studyBar",{scaleX:S.i/CARDS.length,duration:D(.4)});
  gsap.set("#rates",{autoAlpha:0,y:10});
  if(enter&&!RM) gsap.from(card,{y:40,scale:.94,autoAlpha:0,duration:.55,ease:"back.out(1.5)"});
}
function reveal(){
  if(S.flipped||S.done)return;
  S.flipped=true;
  const c=CARDS[S.i];
  gsap.timeline()
    .to(card,{rotationY:90,scale:1.03,y:-8,duration:D(.3),ease:"power2.in"})
    .add(()=>{
      const b=$("#cardBody");
      b.className="card-a"; b.innerHTML=c.back;
      $("#cardHint").style.display="none";
    })
    .to(card,{rotationY:0,scale:1,y:0,duration:D(.36),ease:"back.out(1.6)"})
    .to("#rates",{autoAlpha:1,y:0,duration:D(.3)},RM?"":"-=.15");
}
function rate(g,label){
  if(!S.flipped||S.done)return;
  S.last=S.i;
  const m=$("#mark");
  m.textContent=label;
  const dir=g==="again"?-1:1;
  const tl=gsap.timeline();
  if(!RM){
    tl.fromTo(m,{scale:2.2,autoAlpha:0,rotation:-24},{scale:1,autoAlpha:1,rotation:-10,duration:.32,ease:"back.out(2.4)"})
      .to(m,{autoAlpha:0,duration:.2,delay:.15});
  }
  tl.to(card,{x:dir*480,rotation:dir*10,autoAlpha:0,duration:D(.45),ease:"power2.in"},"+=.1")
    .add(()=>next());
}
function next(){
  S.i++;
  if(S.i>=CARDS.length){finish();return}
  renderCard(true);
}
function finish(){
  S.done=true;
  $("#cardTag").innerHTML="";
  const b=$("#cardBody");
  b.className="card-done";
  b.innerHTML=`
    <div class="seal"><i class="ph ph-check-fat"></i></div>
    <h2>今日翻牌完毕</h2>
    <p>复习 23 张，新学 10 张，用时 14 分钟</p>
    <button class="btn-flip" data-view="dash"><i class="ph ph-arrow-left"></i>回仪表盘</button>`;
  $("#count").textContent=`${CARDS.length} / ${CARDS.length}`;
  gsap.set(card,{x:0,rotation:0,autoAlpha:1});
  gsap.to("#studyBar",{scaleX:1,duration:D(.4)});
  gsap.set("#rates",{autoAlpha:0});
  if(!RM) gsap.from(".card-done > *",{y:18,autoAlpha:0,stagger:.08,duration:.4,ease:"back.out(1.6)"});
}
card.addEventListener("click",reveal);
$("#rates").addEventListener("click",e=>{
  const b=e.target.closest(".rate");
  if(b) rate(b.dataset.g,b.dataset.label);
});
function undo(){
  if(S.last==null){toast("没有可撤销的评分");return}
  S.i=S.last;S.last=null;
  renderCard(true);
  toast("已撤销，重新评分");
}
$("#undoBtn").addEventListener("click",undo);
document.addEventListener("keydown",e=>{
  if(!$("#view-study").classList.contains("on"))return;
  if(e.code==="Space"){e.preventDefault();if(!S.done)reveal()}
  else if(e.key>="1"&&e.key<="4"){const b=$$("#rates .rate")[+e.key-1];rate(b.dataset.g,b.dataset.label)}
  else if(e.key.toLowerCase()==="z"){undo()}
});

if(!RM){
  gsap.from(".top-in",{y:-18,autoAlpha:0,duration:.45,ease:"power3.out"});
  gsap.from(".hero h1, .hero .sub",{y:20,autoAlpha:0,duration:.5,stagger:.08,ease:"power3.out",delay:.1});
}
runDash();
</script>
</body>
</html>
